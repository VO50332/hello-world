<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שוק מתנות - פריטים בחינם</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-content">
      <h1>🎁 שוק מתנות</h1>
      <p class="subtitle">פריטים בחינם מהקהילה — קח ותיהנה!</p>
    </div>
    <div class="header-actions">
      <input
        type="search"
        id="searchInput"
        placeholder="חיפוש לפי מילה..."
        autocomplete="off"
      />
      <label class="toggle-label">
        <input type="checkbox" id="showTaken" />
        הצג גם פריטים שנלקחו
      </label>
      <button id="clearAllBtn" class="btn-clear-all" onclick="clearAllItems()">🗑️ מחק הכל</button>
    </div>
  </header>

  <!-- Group filter tabs (shown only when multiple groups exist) -->
  <div id="group-tabs" style="display:none"></div>

  <!-- Groups management panel -->
  <div id="groups-panel">
    <details id="groups-details">
      <summary>⚙️ ניהול קבוצות</summary>
      <div class="groups-settings-body">

        <div class="groups-section">
          <h4>קבוצות מוגדרות</h4>
          <div id="configured-groups-list"></div>
        </div>

        <div class="groups-section">
          <h4>הוסף קבוצה</h4>
          <p id="chats-status" class="chats-status-msg"></p>
          <input
            type="search"
            id="groupSearchInput"
            placeholder="חפש לפי שם קבוצה..."
            autocomplete="off"
            dir="rtl"
          />
          <div id="available-groups-list"></div>
          <button class="btn-refresh-chats" onclick="fetchAvailableChats()">רענן רשימה</button>
        </div>

      </div>
    </details>
  </div>

  <!-- Scan control panel -->
  <div id="scan-panel">
    <details>
      <summary>🔍 סריקת הודעות ישנות מהקבוצה</summary>
      <div class="scan-form">
        <div class="scan-row">
          <label>מספר ימים לסרוק
            <input type="number" id="scanDays" value="30" min="1" max="180" />
          </label>
          <label id="scanGroupLabel" style="display:none">קבוצה לסריקה
            <select id="scanGroupSelect"></select>
          </label>
          <label>מילות מפתח (מופרדות בפסיקות)
            <input type="text" id="scanKeywords" placeholder='לדוגמה: כיסא,ספה,מיטה' dir="rtl" />
          </label>
          <button id="scanBtn" class="btn btn-scan" onclick="triggerScan()">התחל סריקה</button>
        </div>
        <div id="scan-status" class="scan-status" style="display:none"></div>
      </div>
    </details>
  </div>

  <main>
    <div id="loading" class="loading">טוען פריטים...</div>
    <div id="empty" class="empty" style="display:none">
      <span>😊</span>
      <p>אין פריטים זמינים כרגע</p>
      <small>פריטים חדשים יופיעו כאן ברגע שמישהו יפרסם בקבוצה</small>
    </div>
    <div id="items-grid" class="items-grid"></div>
  </main>

  <!-- Modal for full-size image -->
  <div id="photo-modal" class="modal" style="display:none">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <img id="modal-img" src="" alt="תמונה מוגדלת" />
  </div>

  <script src="app.js"></script>
</body>
</html>
