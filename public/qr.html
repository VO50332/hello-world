<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>חיבור WhatsApp</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #1a1a2e;
    }
    h1 { color: #128c7e; margin-bottom: 0.3rem; }
    p  { color: #555; margin: 0.3rem 0 1.2rem; font-size: 0.95rem; }
    #box {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 2rem;
      text-align: center;
      max-width: 340px;
      width: 100%;
    }
    canvas { display: block; margin: 0 auto; }
    #status {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      color: #888;
    }
    .connected { color: #2e7d32; font-weight: 700; font-size: 1.1rem; }
    #pin-form { margin-top: 1rem; }
    #pin-form input {
      padding: 0.5rem 1rem;
      font-size: 1.1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      text-align: center;
      width: 140px;
    }
    #pin-form button {
      padding: 0.5rem 1.2rem;
      font-size: 1rem;
      background: #128c7e;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 0.5rem;
    }
    #pin-error { color: #d32f2f; margin-top: 0.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div id="box">
    <h1>📱 חיבור WhatsApp</h1>
    <p>סרוק עם WhatsApp → הגדרות → מכשירים מקושרים → קשר מכשיר</p>
    <canvas id="qr-canvas"></canvas>
    <div id="status">⏳ טוען...</div>

    <div id="pin-form" style="display:none">
      <input id="pin-input" type="password" placeholder="PIN" autocomplete="off" />
      <button onclick="submitPin()">כניסה</button>
      <div id="pin-error"></div>
    </div>
  </div>

  <script>
    let token = '';

    async function start() {
      // Check if auth is required
      const authRes = await fetch('/api/auth-required');
      const authData = await authRes.json();

      if (!authData.required) {
        // No PIN set — go directly to polling
        refresh();
        return;
      }

      // Auth required — show PIN form
      document.getElementById('status').textContent = '🔒 נדרש PIN כדי לצפות בקוד QR';
      document.getElementById('pin-form').style.display = '';
      document.getElementById('pin-input').focus();
    }

    async function submitPin() {
      const pin = document.getElementById('pin-input').value;
      const errEl = document.getElementById('pin-error');
      errEl.textContent = '';

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        const data = await res.json();
        if (data.ok) {
          token = data.token;
          document.getElementById('pin-form').style.display = 'none';
          document.getElementById('status').textContent = '⏳ טוען קוד QR...';
          refresh();
        } else {
          errEl.textContent = 'PIN שגוי';
        }
      } catch (e) {
        errEl.textContent = 'שגיאת רשת';
      }
    }

    // Allow pressing Enter in the PIN field
    document.getElementById('pin-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitPin();
    });

    async function refresh() {
      const statusEl = document.getElementById('status');
      const canvas   = document.getElementById('qr-canvas');
      try {
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
        const res  = await fetch('/api/qr', { headers });

        if (res.status === 401) {
          statusEl.textContent = '🔒 נדרש PIN כדי לצפות בקוד QR';
          document.getElementById('pin-form').style.display = '';
          return; // stop polling — user needs to re-auth
        }

        const data = await res.json();

        if (data.connected) {
          canvas.style.display = 'none';
          statusEl.className   = 'connected';
          statusEl.textContent = '✅ מחובר! ניתן לסגור דף זה.';
          return; // stop polling
        }

        if (data.qr) {
          canvas.style.display = '';
          await QRCode.toCanvas(canvas, data.qr, { width: 260, margin: 1 });
          statusEl.textContent = '🔄 מתרענן בכל 10 שניות';
        } else {
          statusEl.textContent = '⏳ ממתין לקוד QR...';
        }
      } catch (e) {
        statusEl.textContent = '⚠️ שגיאת רשת — מנסה שוב...';
      }
      setTimeout(refresh, 10_000);
    }

    start();
  </script>
</body>
</html>
